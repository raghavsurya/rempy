[project]
name = "rempy"
version = "0.1.0"
description = "This app helps users track their reminders, events, upcoming payments and much more"
readme = "README.md"
authors = [
    { name = "Raghav Surya", email = "raghav.surya@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "neo4j>=6.3.1",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
rempy = "rempy:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
